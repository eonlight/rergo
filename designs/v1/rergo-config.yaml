points:
   key:
      padding: cy
      footprints:
          choc_hotswap:
            type: choc
            nets:
              from: =column_net
              to: GND
            params:
                keycaps: true
                reverse: true
                hotswap: true
          choc:
            type: choc
            anchor:
              rotate: 180
            nets:
              from: =column_net
              to: GND
            params:
                keycaps: true
                reverse: true
   zones:
    main:
      rotate: 15
      anchor:
        rotate: 5
      columns:
        pinkie:
          rows:
            bottom:
              column_net: P19
            home:
              column_net: P18
            top:
              column_net: P15
        ring:
          rotate: -10
          stagger: 10
          spread: cx + 4
          rows:
            bottom:
              column_net: P14
            home:
              column_net: P16
            top:
              bind: [0,2.4,0,2] # [u,r,d,l]
              column_net: P10
        middle:
          stagger: 3
          rotate: -4
          spread: cx + 2
          rows:
            bottom:
              column_net: P9
            home:
              column_net: P8
            top:
              bind: [0.5,2,0,3] # [u,r,d,l]
              column_net: P7
        index:
          rotate: -3
          stagger: -8
          spread: cx + 3
          rows:
            bottom:
              column_net: P5
            home:
              column_net: P3
              bind: [10,0,1.5,14] # [u,r,d,l]
            top:
              bind: [0,1,3,10]
              column_net: P2
        inner:
          rotate: -3
          stagger: -5
          spread: cx + 1
          rows:
            bottom:
              bind: [34,25,10,10] # [u,r,d,l]
              column_net: P6
            home:
              column_net: P4
            top:
              column_net: P1
      rows:
        bottom:
        home:
        top:
    thumbfan:
      anchor:
        ref: main_inner_bottom
        shift: [-7, -23]
      columns:
        near:
          rows:
            thumb:
              column_net: P20
        home:
          spread: 22
          rotate: -25
          origin: [-11.75, -9]
          rows:
            thumb:
              column_net: P21
      rows:
        thumb:
outlines:
  exports:
    raw: 
      - type: keys
        side: both
        size: [1cx - 0.5 , 1cy - 0.5]
      - type: rectangle
        size: [61, 52]
        anchor:
          ref: main_pinkie_bottom
          shift: [-11, -8.75]
      - type: rectangle
        size: [82, 30]
        anchor:
          ref: thumbfan_home_thumb
          shift: [-70, -9.5]
    cutout:
      - type: outline
        name: raw
        fillet: 2
    keycap_outlines:
      - type: keys
        side: left
        size: [1cx - 0.5, 1cy - 0.5] # Choc keycaps are 17.5 x 16.5
        bound: false
pcbs:
  rergo:
    outlines:
      main:
        outline: cutout
      keycaps:
        outline: keycap_outlines
        layer: Eco1.User
    footprints:
      promicro:
        type: promicro_pretty
        anchor:
          ref: main_inner_bottom
          shift: [20, 22]
          rotate: -90
      b3u1000p:
        type: b3u1000p
        nets:
          r1: RST  
          r2: GND
        anchor:
          ref: main_inner_bottom
          shift: [29, 40]
        params:
          reverse: true 
      pcm12:
        type: pcm12
        anchor:
          ref: main_inner_bottom
          shift: [30, -7]
          rotate: 90
        nets:
          from: pos  
          to: RAW
        params:
          reverse: true 
      bat:
        type: bat
        nets: 
          neg: GND
        anchor:
          ref: main_inner_bottom
          shift: [27.5, 3]
      via2:
        type: via
        anchor: 
          ref: main_inner_top
          shift: [15,6]
        nets: 
          net: GND
      via3:
        type: via
        anchor: 
          ref: thumbfan_home_thumb
          shift: [-2,23.5]
        nets: 
          net: RAW
      via5:
        type: via
        anchor: 
          ref: main_inner_bottom
          shift: [30,-13]
        nets: 
          net: pos
      via6:
        type: via
        anchor:
          ref: main_inner_bottom
          shift: [30.5,33.5]
        nets: 
          net: RST
points:
  key.padding: cy
  zones:
    main:
      anchor.shift: [100, -100]  # Fix placement on KiCAD sheet
      anchor.rotate: 14
      key.spread: cx
      rows:
        bottom:
        home:
        top:
      columns:
        pinky:
          rows.bottom.column_net: P4
          rows.home.column_net: P21
          rows.top.column_net: P20
          key.bind: [0, 0, 0, 2.5]
          rows.bottom.bind: [0, 27.5, 0, 2.5] # u r d l
          rows.top.bind: [7, 4, 0, 2.5] # u r d l
        ring:
          key.splay: -8
          key.stagger: cy * 0.66
          key.spread: cx * 1.15
          rows.bottom.column_net: P19
          rows.home.column_net: P18
          rows.top.column_net: P17
          rows.top.bind: [1, 3, 0, 2.5] # u r d l
        middle:
          key.splay: -2
          key.stagger: cy * 0.4
          key.spread: cx * 1.2
          rows.bottom.column_net: P16
          rows.home.column_net: P15
          rows.top.column_net: P14
          rows.top.bind: [0, 0, 0, 2.5]
        index:
          key.splay: -2
          key.stagger: cy * -0.65
          key.spread: cx * 1.2
          rows.bottom.column_net: P13
          rows.home.column_net: P12
          rows.top.column_net: P11
          rows.top.bind: [4, 0, 0, 4] # u r d l
        far:
          key.splay: -5
          key.stagger: cy * -0.5
          key.spread: cx * 1.2
          rows.bottom.column_net: P10
          rows.home.column_net: P9
          rows.top.column_net: P8
          rows.top.bind: [3, 25, 50, 8] # u r d l
    thumb:
      anchor:
        ref: main_far_bottom
        shift: [cx * -1.5 , cy * -1.35]
        rotate: -4
      rows.single:
      columns:
        extra:
          key.rotate: 8
          key.shift: [cx * -0.5, cy * -0.15]
          key.bind: [25, 0, 0.75, 2] # u r d l
          rows.single.column_net: P5
        inner:
          key.rotate: 6
          key.shift: [cx * 0, 0]
          key.bind: [15, 8.75, 0, 10] # u r d l
          rows.single.column_net: P7
        home:
          key.rotate: -10
          key.shift: [cx * 0.6, 0]
          key.bind: [0, 6, 0, 10] # u r d l
          rows.single.column_net: P6

outlines:
  raw:
    - what: rectangle # main key outlines
      where: true
      size: [cx + 2, cy + 1.5]
      bound: true
  cutout:
    - what: outline
      name: raw
      fillet: 2
  keycap:
    - where: true
      what: rectangle
      size: [cx - 0.5, cy - 0.5]
      bound: false

cases:
  plate:
    - name: cutout

pcbs:
  rergo:
    outlines:
      main.outline: cutout
      keycaps:
        outline: keycap
        layer: Eco1.User
    footprints:
      choc_hotswap:
        what: choc
        where: true
        params:
          from: "{{column_net}}"
          to: GND
          keycaps: true
          reverse: true
          hotswap: true
      choc:
        what: choc
        where: true
        adjust.rotate: 180
        params:
          from: "{{column_net}}"
          to: GND
          keycaps: true
          reverse: true
      nice_nano:
        what: ceoloide/mcu_nice_nano
        params.reversible: true
        params.reverse_mount: true
        where:
          ref: main_far_home
          shift: [21.5, 7.5]
          rotate: 0
      power:
        what: ceoloide/power_switch_smd_side
        params:
          reversible: true
          from: pos
          to: RAW
        where:
          ref: main_far_bottom
          shift: [31.5, -12.5]
      reset:
        what: b3u1000p
        params:
          reverse: true
          r1: RST
          r2: GND
        where:
          ref: main_pinky_top
          shift: [5, 13.5]
      bat:
        what: ceoloide/battery_connector_jst_ph_2
        where:
          ref: main_far_bottom
          shift: [30, 0]
          rotate: -90
        params:
            reversible: true
            BAT_P: pos
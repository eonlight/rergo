points:
  key.padding: cy
  zones:
    main:
      anchor.rotate: 14
      key.spread: cx
      rows:
        bottom:
        home:
        top:
      columns:
        pinky:
          rows.bottom.column_net: P4
          rows.home.column_net: P21
          rows.top.column_net: P20
        ring:
          key.splay: -8
          key.stagger: cy * 0.66
          key.spread: cx * 1.15
          rows.bottom.column_net: P19
          rows.home.column_net: P18
          rows.top.column_net: P17
        middle:
          key.splay: -2
          key.stagger: cy * 0.4
          key.spread: cx * 1.2
          rows.bottom.column_net: P16
          rows.home.column_net: P15
          rows.top.column_net: P14
        index:
          key.splay: -2
          key.stagger: cy * -0.65
          key.spread: cx * 1.2
          rows.bottom.column_net: P13
          rows.home.column_net: P12
          rows.top.column_net: P11
        far:
          key.splay: -5
          key.stagger: cy * -0.5
          key.spread: cx * 1.2
          rows.bottom.column_net: P10
          rows.home.column_net: P9
          rows.top.column_net: P8
    thumb:
      anchor:
        ref: main_far_bottom
        shift: [cx * -1.5 , cy * -1.35]
        rotate: -4
      rows.single:
      columns:
        extra:
          key.rotate: 8
          key.shift: [cx * -0.5, cy * -0.15]
          rows.single.column_net: P5
        inner:
          key.rotate: 6
          key.shift: [cx * 0, 0]
          rows.single.column_net: P7
        home:
          key.rotate: -10
          key.shift: [cx * 0.6, 0]
          rows.single.column_net: P6

outlines:
  raw:
    - what: rectangle # main key outlines
      where: true
      size: [cx * 1.5, cy * 1.5]
    - what: rectangle # combine thumb keys
      where: thumb_extra_single
      size: [cx * 4, cy * 1.75]
      adjust.shift: [cx * 1.25, 0]
    - what: rectangle # close down gaps main/thumb
      where: main_middle_bottom
      size: [cx * 4, cy * 3.9]
    - what: rectangle # add space for nicenano
      where: main_far_home
      size: [cx * 3.5, cy * 3]
    - what: rectangle # close space nicenano/thumb
      where: main_far_bottom
      size: [cx * 3.5, cy * 2]
  cutout:
    - what: outline
      name: raw
      fillet: 2
  keycap:
    - where: true
      what: rectangle
      size: [cx - 0.5, cy - 0.5]
      bound: false

pcbs:
  rergo:
    outlines:
      main.outline: cutout
      keycaps:
        outline: keycap
        layer: Eco1.User
    footprints:
      choc_hotswap:
        what: choc
        where: true
        params:
          from: "{{column_net}}"
          to: GND
          keycaps: true
          reverse: true
          hotswap: true
      choc:
        what: choc
        where: true
        adjust.rotate: 180
        params:
          from: "{{column_net}}"
          to: GND
          keycaps: true
          reverse: true
      nice_nano:
        what: ceoloide/mcu_nice_nano
        params.reversible: true
        where:
          ref: main_far_home
          shift: [20, 5]
          rotate: 0
      power:
        what: ceoloide/power_switch_smd_side
        params:
          reversible: true
          from: pos
          to: RAW
        where:
          ref: main_ring_bottom
          rotate: -90
          shift: [0, -22.5]
      b3u1000p:
        what: b3u1000p
        params:
          reverse: true
          r1: RST
          r2: GND
        where:
          ref: main_far_bottom
          shift: [25, 0]
      jstph:
        what: ceoloide/battery_connector_jst_ph_2
        where:
          ref: main_far_bottom
          shift: [27.5, -7.5]
          rotate: -90
        params:
            reversible: true
            BAT_P: pos